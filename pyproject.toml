[project]
name = "handel"
version = "0.1.0"
description = "A negotiation benchmark: LLM agents play an original property-trading board game set in Polish and Dutch cities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
handel-sim = "handel.cli:main"
handel-play = "handel.play:main"
handel-value = "handel.fairvalue:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running benchmark tests (deselect with -m 'not slow')"]
