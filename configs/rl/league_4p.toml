# Phase 10: self-play league, 4 players.
# The learner plays against itself, older snapshots of itself and fixed bots.
# Target: beat 3 heuristic bots more often than the fair share of 25%.
# Starts from the long Phase 9 run.
#
#   uv run handel-train configs/rl/league_4p.toml
#   uv run handel-train --resume runs/league_4p_s0        (after stopping it)

name = "league_4p"
seed = 0
total_steps = 400_000_000   # RL decisions; 6.5 to 8 hours on an Apple M1 (14,000 to 17,500 decisions per second)
init_from = "runs/ppo_4p_vs_bots_long_s0/latest.pt"

[game]
players = 4
max_rounds = 150

[opponents]
# Bots for the "bots" share of the league mix. A name listed twice is drawn twice as often.
pool = ["heuristic", "heuristic", "heuristic_notrade", "always_buy"]

[league]
snapshot_every = 25       # updates between snapshots; every snapshot also plays a rating round
current = 0.4             # share of the other seats: the current policy (self-play, also learned from)
snapshots = 0.4           # ... a past snapshot
bots = 0.2                # ... a bot from [opponents] pool. A 30/20/50 mix scored the same in short tests
recent_count = 8          # half of the snapshot seats come from the newest 8 snapshots,
recent_share = 0.5        # the other half from all snapshots, so old ones never disappear
rating_games = 200        # Elo games per snapshot (about 2 seconds)
rating_k = 32.0

[model]
hidden = [256, 256]
end_turn_bias = 2.0       # only matters for a fresh network (ignored with init_from)

[ppo]
steps_per_update = 65536
epochs = 4
minibatch_size = 4096
lr = 1e-4                 # 1e-4 learned earlier and more steadily than 3e-4 in 4 player runs
anneal_lr = true          # decays to 0 at total_steps; a constant rate ended 1.7 points lower in short tests
gamma = 1.0
gae_lambda = 0.99
clip = 0.2
vf_coef = 0.5
ent_coef = 0.0
max_grad_norm = 0.5
target_kl = 0.0

[reward]
win = 1.0
shaping_coef = 0.0
shaping_decay = true

[eval]
every = 50                # updates between evaluations; keep it a multiple of league.snapshot_every
games = 1000
lineups = [
    ["heuristic", "heuristic", "heuristic"],     # the fixed benchmark: picks best.pt and drives the self-play warning
    ["always_buy", "always_buy", "always_buy"],
]

[run]
workers = 0               # 0 = one rollout process per CPU core
learner_threads = 4
checkpoint_every = 100
entropy_warn = 0.05       # warn when the policy entropy falls below this (nats)
