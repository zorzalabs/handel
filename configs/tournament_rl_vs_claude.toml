# PAID showcase (Phase 14): the RL agent against cheap Claude models and the heuristic bot,
# every seed in all 4 seat rotations. Needs OPENROUTER_API_KEY in .env.
#
# It spends real money: check the budget below before running it.
#
# DONE: ran once on Nov 20, 2026 (63 of 80 games, EUR 2.93, budget used up). Do not run again;
# the results are in results/tournament_rl_vs_claude and in the README.
#
# Hard budget: EUR 3. The tournament stops by itself before a game it cannot pay for,
# and a paid call that would go past the budget is refused (Phase 5). Re-running the same
# command resumes; interrupted games replay from the reply cache for free.
#
# Estimate first (offline, no API calls):
#   uv run python -m handel.rl.showcase_cost configs/tournament_rl_vs_claude.toml
# Then, only after the go:
#   uv run handel-tournament configs/tournament_rl_vs_claude.toml --max-games 4   # one seed first
#   uv run handel-tournament configs/tournament_rl_vs_claude.toml
#   uv run handel-analyze results/tournament_rl_vs_claude --value
#
# Few games means wide intervals: this is a showcase, not a ranking.
#
# Estimate (Nov 20, 2026, from the 5 paid Phase 5 games and 80 offline games with stand-in
# bots in the Claude seats): EUR 0.047 to 0.058 per game, so EUR 3 buys about 50 to 64 games
# (12 to 16 seeds x 4 rotations), about 1.5 to 2 hours at 4 games in parallel.
# Why two Haiku seats: with Sonnet instead of one of them a game costs about EUR 0.29 to 0.37
# and EUR 3 buys only 8 to 10 games (2 seeds).
# Why the final agent and not the refusal-cost agent (models/handel_rl_refusecost.pt, B5):
# B5 sends far fewer offers to the Claude seats (0.5 to 1.3 per seat and game instead of 2.3
# to 8.2), but it is the weaker player (48% vs 57% against 3 heuristic bots), so games last
# 6 to 7 rounds longer and the Claude seats make more of their other decisions. The cost per
# game comes out the same (EUR 0.050 to 0.058), so the stronger agent costs nothing extra.

[tournament]
seeds = 20            # more than EUR 3 buys; the budget ends the run
rotate = true         # 4 rotations per seed, so every entrant sits in every seat
budget_eur = 3.0      # real spend limit across all runs of this tournament
parallel = 4

[game]
max_rounds = 150

[llm]
max_tokens = 4000
json_mode = false
manage_policy = "opportunity"
history_events = 12
timeout_s = 120
usd_to_eur = 0.92
extra = { reasoning = { effort = "low" } }

[pricing]
"anthropic/claude-haiku-5.5" = { input = 0.10, output = 0.50 }

[[seats]]
type = "rl"
name = "rl-agent"
checkpoint = "models/handel_rl_final.pt"   # Phase 12 agent (see above for the B5 alternative)
sample = false

[[seats]]
type = "llm"
model = "anthropic/claude-haiku-5.5"
name = "haiku-a"

[[seats]]
type = "llm"
model = "anthropic/claude-haiku-5.5"
name = "haiku-b"

[[seats]]
type = "bot"
bot = "heuristic"
